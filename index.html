<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100820">
<title>MARFIN STORE</title>
<style>
:root{color-scheme:dark;--bg:#100820;--card:#1b1033;--line:#3a2766;--ac:#a66bff;--ac2:#ff4fd8;--tx:#f1eaff;--mut:#a99bc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.06em;color:var(--ac)}
a.cs{color:var(--tx);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:14px}
.hero{padding:36px 18px 20px;text-align:center;background:radial-gradient(circle at 50% 0,#2b1458,transparent 70%)}
.hero h1{margin:0 0 8px;font-size:clamp(26px,7vw,40px)}
.hero p{margin:0 auto;max-width:34ch;color:var(--mut)}
.stats{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.stats div{border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--mut)}
.stats b{display:block;color:var(--tx);font-size:15px}
main{max-width:900px;margin:0 auto;padding:10px 16px 40px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.tabs button{flex:none;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#12062a;border-color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.p{min-width:0}
@media(max-width:759px){main{padding:10px 12px 90px}.grid{gap:10px}.p{padding:12px}.ph{width:calc(100% + 24px);margin:-12px -12px 6px}.p h3{font-size:15px}.ds,.rt{font-size:11.5px}.ds{min-height:48px}.du{font-size:12px;padding:6px}button.cta{font-size:13px;padding:9px 4px}}
button.apk{background:#120a26;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:auto}
button.apk+button.cta{margin-top:0}
.ph{width:calc(100% + 32px);margin:-16px -16px 6px;aspect-ratio:318/238;object-fit:cover;border-radius:14px 14px 0 0;display:block;background:#0b0618}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.p small{color:var(--ac2)}
.du{font-size:13px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;text-align:center;color:var(--mut)}
.ds{font-size:13px;color:var(--mut);min-height:40px}.rt{font-size:12px;color:var(--mut)}
.p h3{margin:0;font-size:17px}
.p .pr{color:var(--mut);font-size:14px;margin-bottom:6px}
button.cta{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#12062a;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:auto}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(5,2,14,.8);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92%;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;background:#120a26;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#120a26;color:var(--tx);font-size:18px;cursor:pointer}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay button{flex:1;background:#120a26;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.pay button.on{border-color:var(--ac2);background:#2a1450}
.tot{display:flex;justify-content:space-between;margin:16px 0 6px;font-weight:700}
.note{font-size:12px;color:var(--mut);margin:0 0 12px}
.err{color:#ff8aa5;font-size:13px;min-height:18px}
.x{float:right;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
.tnc li{margin-bottom:10px;font-size:14px}
.tnc{padding-left:18px;margin:0 0 14px}
.hm{font-size:26px;color:var(--tx)}
.pn{font-size:24px;color:#e07bff;margin:0 40px 6px 0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips button{background:#120a26;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 4px;font:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.chips button b{color:#c58bff;font-size:14px}
.chips button.on{background:#2a1450;border-color:var(--ac)}
.chips.c3 button{padding:14px 4px}
input::placeholder{color:#6f6490}
.note{color:#e5c26a}
.tnb{margin:auto 14px;width:100%;max-width:520px;background:#12091f;border-radius:28px;padding:24px 20px;border:2px solid transparent;background-image:linear-gradient(#12091f,#12091f),linear-gradient(135deg,#ff4fa8,#9b4dff,#2fd6e6);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 0 50px rgba(155,77,255,.35);max-height:92%;overflow:auto}
.tnh{display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.sh{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff4fa8,#9b4dff);display:grid;place-items:center;font-size:26px;flex:none}
.eb{color:#2fd6e6;font-size:11px;letter-spacing:.15em;font-weight:700}
.tnb h2{margin:2px 0 0;font-size:21px}
.tp{color:var(--mut);margin:14px 0}
.rl{display:flex;gap:12px;background:#1a1030;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.rl i{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#12062a;font-style:normal;font-weight:800}
.rl h4{margin:0 0 4px;font-size:15px}.rl p{margin:0;font-size:14px;color:var(--mut)}.rl b{color:var(--tx)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tx);margin:14px 0}
.ck input{width:22px;height:22px;flex:none;accent-color:#ff4fa8}
.csf{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#f1eaff;color:#12062a;font-weight:700;padding:12px 18px;border-radius:24px;text-decoration:none;z-index:10}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#120a26ee;border-top:1px solid var(--line)}
.bar small{display:block;color:var(--mut);font-size:13px}.bar b{font-size:24px}
.bar .cta{margin:0;padding:14px 22px}
main{padding-bottom:180px}
.bn{max-width:900px;margin:6px 16px 0;padding:3px;border-radius:18px;background:linear-gradient(135deg,#ff4fa8,#9b4dff,#2fd6e6)}
.bn img{display:block;width:100%;border-radius:15px}
.pv{margin:14px 16px 0;padding:12px;border-radius:14px;text-align:center;font-weight:700;font-size:13px;background:linear-gradient(90deg,#ff2fa0,#8a3dff);color:#fff}
@media(min-width:900px){.bn,.pv{margin-left:auto;margin-right:auto}}
.dlb{position:relative;margin:auto 16px;width:100%;max-width:440px;background:#111a2e;border:1px solid #25304a;border-radius:28px;padding:26px 18px 20px;text-align:center}
.dlb .x{position:absolute;right:18px;top:18px;float:none;font-size:22px}
.dli{width:68px;height:68px;border-radius:20px;background:#12352f;display:grid;place-items:center;margin:0 auto 14px}
.dlb h2{margin:0 0 6px;font-size:22px}.dlb p{margin:0 0 18px;color:#8e9bb5;font-size:14px}
.dle{text-decoration:none;display:flex;align-items:center;gap:14px;width:100%;background:#0b1424;color:var(--tx);border:1px solid #25304a;border-radius:20px;padding:14px;margin-bottom:12px;font:inherit;cursor:pointer;text-align:left}
.dle>span:nth-child(2){flex:1}.dle b{display:block;font-size:18px}.dle em{font-style:normal;color:#3de0a0;font-size:13px}
.dlc{width:48px;height:48px;border-radius:14px;background:#12352f;display:grid;place-items:center;flex:none}.dlc svg{width:26px;height:26px}
.ex{color:#8e9bb5;font-size:22px}
#tnc .tnb{max-height:90vh;max-height:90dvh;padding-bottom:0}
#agree{position:sticky;bottom:0;box-shadow:0 -16px 14px #12091f;margin-bottom:0;border-radius:14px}
#tnc .tnb::after{content:"";display:block;height:20px;background:#12091f;margin:0 -20px;position:sticky;bottom:0}
@media(max-height:820px){.rl{padding:10px 12px;margin-bottom:8px}.rl p{font-size:13px}.rl h4{font-size:14px}.tp{margin:10px 0}.tnb h2{font-size:18px}.tnh{padding-bottom:10px}}

/* ===== upgrade ===== */
header.top{position:sticky;top:0;z-index:8;background:#100820d9;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero h1{background:linear-gradient(90deg,#fff,var(--ac) 60%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats div{background:#1b103380}
.tools{display:flex;gap:10px;padding:6px 0 0}
.sb{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.sb:focus-within{border-color:var(--ac)}
.sb input{border:0;background:none;padding:10px 0;outline:none}
.tools select{width:auto;flex:none;border-radius:12px;background:var(--card)}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.p{position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;animation:up .4s both}
@media(hover:hover){.p:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px rgba(166,107,255,.2)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stk{font-size:11px;margin:2px 0 7px;color:#39d98a;font-weight:700}.stk .out{color:#ff647c}.pp{font-size:13px;color:var(--mut)}.pp b{color:var(--tx);font-size:16px}
.bdg{position:absolute;top:10px;left:10px;z-index:2;background:linear-gradient(90deg,#ff4fa8,#ff8a3d);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
button.cta{transition:filter .2s,transform .1s}button.cta:hover{filter:brightness(1.1)}button.cta:active{transform:scale(.98)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.csf{box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Akses unduhan memakai ID pesanan; verifikasi tetap dilakukan oleh API */
.dlform{display:flex;gap:8px;margin:0 0 14px}
.dlform input{min-width:0;flex:1}
.dlform button{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#12062a;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
#dlstatus{min-height:20px;color:#e5c26a;font-size:13px;margin:0 0 10px}
#orderDone .dlb{max-height:90%;overflow:auto}

</style>
</head>
